<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>红炉号 · 沿线观光体验智慧导览</title>
<style>
:root{--paper:#FBF4E8;--ink:#3A2318;--red:#8B1A0F;--muted:#9B8B78;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#241A12;color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC",sans-serif}
button{font-family:inherit;touch-action:manipulation}
#app{min-height:100vh;min-height:100dvh}

/* ============ 总览页 ============ */
.ov{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;position:relative;padding:10px}
.stage{position:relative;width:min(100%,calc(100dvh * 0.7076));border-radius:10px;overflow:hidden;
  box-shadow:0 18px 60px rgba(0,0,0,.55)}
.stage img.poster{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;transform:translate(-50%,-50%);width:10.5%;aspect-ratio:1/1;border-radius:50%;
  border:none;background:transparent;padding:0;cursor:pointer;z-index:5}
.hot .ring{position:absolute;inset:14%;border-radius:50%;pointer-events:none;
  border:2.5px solid rgba(139,26,15,.85);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(139,26,15,.42)}70%{box-shadow:0 0 0 16px rgba(139,26,15,0)}100%{box-shadow:0 0 0 0 rgba(139,26,15,0)}}
.hot:active .ring{background:rgba(139,26,15,.18)}
.hit{position:absolute;border:none;background:transparent;padding:0;cursor:pointer;z-index:4}
.hintbar{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(36,26,18,.88);color:#F7E8D3;font-size:13.5px;letter-spacing:.06em;
  padding:9px 18px;border-radius:999px;z-index:9;white-space:nowrap;
  box-shadow:0 6px 18px rgba(0,0,0,.4);transition:opacity .6s;pointer-events:none}
.hintbar.fade{opacity:0}
.fab{position:absolute;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:9;
  background:var(--red);color:#fff;border:none;border-radius:999px;padding:11px 18px;font-size:14px;
  font-weight:600;letter-spacing:.08em;box-shadow:0 8px 20px rgba(139,26,15,.45);cursor:pointer}
.sheet-mask{position:fixed;inset:0;background:rgba(20,12,8,.55);z-index:19;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);
  border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .28s ease;max-height:72dvh;overflow:auto}
body.sheet-open .sheet-mask{opacity:1;pointer-events:auto}
body.sheet-open .sheet{transform:translateY(0)}
.sheet h3{margin:2px 6px 12px;font-size:16px;color:var(--red);letter-spacing:.1em}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #E7D6BF;border-radius:12px;
  padding:10px 12px;cursor:pointer;text-align:left}
.chip .no{flex:0 0 30px;height:30px;border-radius:50%;color:#fff;font-weight:700;font-size:15px;
  display:flex;align-items:center;justify-content:center}
.chip .nm{font-size:14.5px;font-weight:600;color:var(--ink)}
.chip .tg{font-size:11.5px;color:var(--muted);margin-top:2px}
.sheet-close{position:absolute;right:14px;top:12px;border:none;background:#EFE2CE;color:#7A6A55;
  width:28px;height:28px;border-radius:50%;font-size:15px;cursor:pointer}

/* ============ 详情页 ============ */
.dt{min-height:100vh;min-height:100dvh;background:var(--paper);display:flex;flex-direction:column}
.dt-head{position:relative;color:#fff;padding:18px 18px 26px;overflow:hidden}
.dt-head .watermark{position:absolute;right:-14px;top:-30px;font-size:150px;font-weight:800;opacity:.16;line-height:1}
.dt-head .back{position:absolute;left:14px;top:calc(12px + env(safe-area-inset-top));z-index:2;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:999px;
  padding:7px 14px;font-size:13px;cursor:pointer}
.dt-head .strip{font-size:11.5px;letter-spacing:.14em;opacity:.9;margin:34px 0 10px}
.dt-head .row{display:flex;align-items:center;gap:13px}
.dt-head .badge{flex:0 0 52px;height:52px;border-radius:50%;background:rgba(255,255,255,.92);
  color:var(--hd,#8B1A0F);font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.25)}
.dt-head h1{margin:0;font-size:23px;letter-spacing:.04em}
.dt-head .tagline{font-size:13.5px;opacity:.92;margin-top:4px;letter-spacing:.05em}
.dt-body{padding:18px 16px 8px;flex:1}
.sec{background:#fff;border:1.5px solid #EBDCC5;border-radius:14px;padding:14px 15px;margin-bottom:14px}
.sec h4{margin:0 0 8px;font-size:15px;color:var(--red);letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.sec h4::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--sc,#8B1A0F)}
.sec .c{font-size:14.5px;line-height:1.85;color:#4A3B2C}
.todo{border:1.5px dashed rgba(139,26,15,.4);background:#FFFDF6;border-radius:10px;
  padding:14px 12px;color:var(--muted);font-size:13.5px;line-height:1.7}
.pager{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;padding:6px 16px calc(22px + env(safe-area-inset-bottom))}
.pager button{border-radius:12px;padding:13px 6px;font-size:14px;cursor:pointer;border:1.5px solid #E0CDB2;background:#fff;color:var(--ink);font-weight:600}
.pager button.primary{background:var(--red);border-color:var(--red);color:#fff;letter-spacing:.1em}
.dt-foot{text-align:center;color:#B7A88F;font-size:11.5px;letter-spacing:.22em;padding:0 0 18px}

/* ============ 调试模式 ?debug=1 ============ */
.debug .hot{outline:2px solid #00C2FF;background:rgba(0,150,255,.14)}
.debug .hot::after{content:attr(data-label);position:absolute;left:50%;top:102%;transform:translateX(-50%);
  background:#0038FF;color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;white-space:nowrap;z-index:10}
.debug .hit{outline:1.5px dashed #00C2FF;background:rgba(0,150,255,.08)}
</style>
</head>

/* ====== 工具 ====== */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function secHtml(st, key, title){
  const v = st.sections[key];
  const body = v ? '<div class="c">'+v+'</div>'
    : '<div class="todo">✎ 内容筹备中——本站「'+title+'」文案确定后在此展示。</div>';
  return '<section class="sec" style="--sc:'+st.accent+'"><h4>'+title+'</h4>'+body+'</section>';
}

/* ====== 总览页 ====== */
function renderPoster(){
  let h = '<div class="ov"><div class="stage"><img class="poster" src="'+POSTER+'" alt="红炉号沿线观光体验总览" draggable="false">';
  STATIONS.forEach(st=>{
    const c = st.circle, b = st.block;
    h += '<button class="hot" data-go="'+st.route+'" aria-label="'+esc(st.name)+'" data-label="S'+st.no+' '+c.x+','+c.y+'" '+
         'style="left:'+c.x+'%;top:'+c.y+'%"><span class="ring"></span></button>';
    h += '<button class="hit" data-go="'+st.route+'" aria-label="'+esc(st.name)+'" '+
         'style="left:'+b.x+'%;top:'+b.y+'%;width:'+b.w+'%;height:'+b.h+'%"></button>';
  });
  h += '</div><div class="hintbar" id="hint">👆 点击站点编号，查看站点故事</div>'+
       '<button class="fab" data-sheet="1">站点目录</button></div>';
  h += '<div class="sheet-mask" data-close="1"></div><div class="sheet"><button class="sheet-close" data-close="1">✕</button>'+
       '<h3>红炉号 · 站点目录</h3><div class="chips">';
  STATIONS.forEach(st=>{
    h += '<button class="chip" data-go="'+st.route+'"><span class="no" style="background:'+st.accent+'">'+st.no+'</span>'+
         '<span><span class="nm">'+esc(st.name)+'</span><br><span class="tg">'+esc(st.tagline)+'</span></span></button>';
  });
  h += '</div></div>';
  document.getElementById('app').innerHTML = h;
  const hint = document.getElementById('hint');
  setTimeout(()=>hint && hint.classList.add('fade'), 6000);
}

/* ====== 详情页 ====== */
function renderDetail(idx){
  const st = STATIONS[idx];
  let h = '<div class="dt"><div class="dt-head" style="background:linear-gradient(135deg,'+st.accent+',#241A12 130%)'+'">'+
      '<div class="watermark">'+st.no+'</div>'+
      '<button class="back" data-go="#/">← 返回总览</button>'+
      '<div class="strip">红炉号沿线观光体验 · 第 '+st.no+' 站 / 共 6 站</div>'+
      '<div class="row"><div class="badge" style="--hd:'+st.accent+'">'+st.no+'</div>'+
      '<div><h1>'+esc(st.name)+'</h1><div class="tagline">'+esc(st.tagline)+'</div></div></div></div>';
  h += '<div class="dt-body">';
  SEC_DEFS.forEach(d=>{ h += secHtml(st, d[0], d[1]); });
  h += '</div><div class="pager">';
  const prev = STATIONS[(idx+5)%6], next = STATIONS[(idx+1)%6];
  h += '<button data-go="'+prev.route+'">← '+prev.no+' '+esc(prev.name.split(' · ')[0])+'</button>'+
       '<button class="primary" data-go="#/">总 览</button>'+
       '<button data-go="'+next.route+'">'+next.no+' '+esc(next.name.split(' · ')[0])+' →</button>';
  h += '</div><div class="dt-foot">红炉号 · 慢轨智行 · 炉火新生</div></div>';
  document.getElementById('app').innerHTML = h;
  window.scrollTo(0,0);
}

  closeSheet();
  const m = location.hash.match(/^#\/s([1-6])$/);
  if (m) renderDetail(+m[1]-1); else renderPoster();
}
function closeSheet(){ document.body.classList.remove('sheet-open'); }
document.addEventListener('click', e=>{
  const go = e.target.closest('[data-go]');
  if (go){ location.hash = go.dataset.go; return; }
  if (e.target.closest('[data-sheet]')){ document.body.classList.add('sheet-open'); return; }
  if (e.target.closest('[data-close]')){ closeSheet(); }
});
window.addEventListener('hashchange', route);
route();
</script>
</body>
